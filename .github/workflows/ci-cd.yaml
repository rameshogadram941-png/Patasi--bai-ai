name: CI/CD — Build & Deploy to Kubernetes
on:
  push:
    branches: [ "patasi-bai-ai-co", "main" ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/patasi-bai-ai:${{ github.sha }}
        cache-from: type=gha

    - name: Save image tag
      run: echo "IMAGE=ghcr.io/${{ github.repository_owner }}/patasi-bai-ai:${{ github.sha }}" >> $GITHUB_ENV

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.27.0'

    - name: Decode kubeconfig
      env:
        KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      run: |
        echo "$KUBE_CONFIG_DATA" | base64 --decode > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Update k8s manifests with image
      run: |
        IMAGE=ghcr.io/${{ github.repository_owner }}/patasi-bai-ai:${{ github.sha }}
        sed -i "s|REPLACE_IMAGE|${IMAGE}|g" k8s/deployment.yaml

    - name: Apply k8s manifests
      run: |
        kubectl apply -f k8s/namespace.yaml || true
        kubectl apply -k k8s/

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/patasi-bai-ai -n default --timeout=120s
